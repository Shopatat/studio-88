<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Essai haut">
<title>Studio 88 — essai du haut d'écran</title>
<style>
  :root{--bg:#0d0c0e;--panel:#141316;--line:#2a2830;--fg:#efece6;--fg2:#9a958f;--brass:#d9b166}
  *{box-sizing:border-box;touch-action:pan-x pan-y}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:-.01em}
  .brand small{font-family:inherit;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg2);margin-left:9px}
  .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px}
  .chip{background:#1c1a20;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--fg2)}
  .tabs{display:flex;gap:18px;padding:0 16px;overflow-x:auto}
  .tabs span{padding:12px 0;font-size:15px;font-weight:600;color:var(--fg2);white-space:nowrap}
  .tabs span.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--brass)}
  header{background:var(--panel);border-bottom:1px solid var(--line)}
  main{padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}
  .v{font-family:Georgia,serif;font-size:28px;margin-top:6px}
  .note{color:var(--fg2);font-size:13.5px;line-height:1.5}

  /* A — en-tête collé en haut, comme l'appli aujourd'hui */
  body.A header{position:sticky;top:0;z-index:9}

  /* B — en-tête qui défile avec la page, rien d'épinglé en haut */
  body.B header{position:static}

  /* C — la page ne défile pas : c'est une zone intérieure qui défile,
         et l'en-tête est en dehors d'elle */
  body.C{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  body.C header{flex:0 0 auto}
  body.C .scroller{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .pick{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:#17151b;border-top:1px solid var(--line)}
  .pick button{flex:1 1 0;font:inherit;font-weight:700;font-size:15px;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:#201d26;color:var(--fg)}
  .pick button[aria-pressed="true"]{background:var(--brass);color:#1a1206;border-color:var(--brass)}
</style>
</head>
<body class="A">
  <header>
      <div class="hrow">
        <div class="brand">Studio 88 <small>Atelier de piano</small></div>
      </div>
      <div class="hrow" style="padding-top:0">
        <span class="chip">🔥 1 j</span><span class="chip">⏱ 46 /20 min</span>
        <span class="chip">● local</span><span class="chip">☾</span><span class="chip">♩ 48</span>
      </div>
      <div class="tabs">
        <span class="on">Aujourd’hui</span><span>Séance</span><span>Apprentissage</span><span>Exercices</span><span>Métronome</span>
      </div>
  </header>
  <div class="scroller">
    <main id="main"></main>
  </div>

  <div class="pick" role="group" aria-label="Variante">
    <button type="button" data-v="A" aria-pressed="true">A</button>
    <button type="button" data-v="B" aria-pressed="false">B</button>
    <button type="button" data-v="C" aria-pressed="false">C</button>
  </div>

<script>
(function(){
  var m=document.getElementById('main'),html='';
  html+='<div class="card"><div class="k">Ce qu’il faut regarder</div>'+
    '<p class="note" style="margin:8px 0 0">Tout en haut : le titre <b>Studio 88</b>, les pastilles et les onglets. '+
    'Sont-ils nets, ou la moitié haute est-elle délavée ? Fais défiler un peu, puis remonte : '+
    'le flou peut n’apparaître qu’une fois le contenu passé derrière.</p>'+
    '<p class="note" style="margin:8px 0 0"><b>A</b> : en-tête collé en haut (l’appli d’aujourd’hui). '+
    '<b>B</b> : en-tête qui défile avec la page. '+
    '<b>C</b> : la page ne défile pas, seule une zone intérieure défile.</p></div>';
  for(var i=1;i<=14;i++){
    html+='<div class="card"><div class="k">Carte '+i+'</div><div class="v">'+(i*7)+' minutes</div></div>';
  }
  m.innerHTML=html;
  var btns=[].slice.call(document.querySelectorAll('.pick button'));
  btns.forEach(function(b){
    b.onclick=function(){
      document.body.className=b.dataset.v;
      btns.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
      window.scrollTo(0,0);
      var s=document.querySelector('.scroller');if(s)s.scrollTop=0;
    };
  });
})();
</script>
</body>
</html>
